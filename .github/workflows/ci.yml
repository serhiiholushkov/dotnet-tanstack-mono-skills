name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # On Windows this is Git Bash (MSYS2) — the shell Windows users run install.sh in.
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # macOS ships bash 3.2; running the suite with /bin/bash keeps the installer
      # honest about the oldest shell it claims to support.
      - name: Run installer tests
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then /bin/bash tests/install.test.sh; else bash tests/install.test.sh; fi
